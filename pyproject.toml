[project]
name = "riemann-and-sons"
version = "0.1.0"
description = "Riemann & Sons — fine deformations of spaces. A differentiable Riemannian-geometry research toolkit in PyTorch."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Riemann & Sons contributors" }]
keywords = ["riemannian geometry", "metric learning", "pytorch", "differential geometry", "geodesics", "ricci flow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/GHamrouni/Riemann-Sons"
Repository = "https://github.com/GHamrouni/Riemann-Sons"
Issues = "https://github.com/GHamrouni/Riemann-Sons/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riemann_and_sons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
